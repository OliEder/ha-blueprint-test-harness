name: CI

# Job "tests" runs the project's own tests. Job "mutation" breaks motion_light.yaml and the fixture blueprint in
# small ways and fails if the tests stop noticing; the survivors, if any, are listed in the job summary.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip show homeassistant pytest-homeassistant-custom-component | grep -E "^(Name|Version)"

      - name: Tests
        run: python -m pytest -p no:cacheprovider -q

  mutation:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Mutation run on Home Assistant's motion_light blueprint
        run: |
          blueprint="$(python -c "import pathlib, homeassistant.components.automation as a; print(pathlib.Path(a.__file__).parent / 'blueprints' / 'motion_light.yaml')")"
          set +e
          python -m ha_blueprint_test_harness.mutate "$blueprint" --fail-under 100 -- \
            python -m pytest -q -x -p no:cacheprovider tests/test_motion_light.py | tee mutation.txt
          status=${PIPESTATUS[0]}
          { echo "### Mutation run: motion_light.yaml"; echo; echo '```'; tail -n 30 mutation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Mutation run on the fixture blueprint
        if: always()
        run: |
          set +e
          python -m ha_blueprint_test_harness.mutate tests/blueprints/daylight_heartbeat.yaml --fail-under 100 -- \
            python -m pytest -q -x -p no:cacheprovider tests/test_daylight_heartbeat.py | tee mutation-fixture.txt
          status=${PIPESTATUS[0]}
          { echo "### Mutation run: daylight_heartbeat.yaml"; echo; echo '```'; tail -n 30 mutation-fixture.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
