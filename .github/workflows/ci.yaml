name: CI

# Job "tests" runs the project's own tests with `pytest-homeassistant` (maintained in Home Assistant core,
# requirements-dev.txt). Job "tests-custom-component" runs the same tests with the older package
# `pytest-homeassistant-custom-component` (requirements-dev-custom-component.txt). Job "mutation" breaks
# motion_light.yaml, the fixture blueprint and the reference automations in small ways and fails if the tests stop noticing; the survivors, if
# any, are listed in the job summary. It uses the package from core.
#
# The jobs run side by side (the slow mutation job does not wait for the tests). Nothing is skipped: both always
# run, so a green check always means that the work was done. If the tests fail on the unchanged blueprint, the
# mutation tool stops by itself and says so (see docs/mutation-testing.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip list | grep -E "^(homeassistant|pytest-homeassistant[a-z-]*) "

      - name: Tests
        run: python -m pytest -p no:cacheprovider -q

  tests-custom-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev-custom-component.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev-custom-component.txt
          python -m pip list | grep -E "^(homeassistant|pytest-homeassistant[a-z-]*) "

      - name: Tests
        run: python -m pytest -p no:cacheprovider -q

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Mutation run on Home Assistant's motion_light blueprint
        run: |
          blueprint="$(python -c "import pathlib, homeassistant.components.automation as a; print(pathlib.Path(a.__file__).parent / 'blueprints' / 'motion_light.yaml')")"
          set +e
          python -m ha_blueprint_test_harness.mutate "$blueprint" --fail-under 100 -- \
            python -m pytest -q -x -p no:cacheprovider tests/test_motion_light.py | tee mutation.txt
          status=${PIPESTATUS[0]}
          { echo "### Mutation run: motion_light.yaml"; echo; echo '```'; tail -n 30 mutation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Mutation run on the fixture blueprint
        if: always()
        run: |
          set +e
          python -m ha_blueprint_test_harness.mutate tests/blueprints/daylight_heartbeat.yaml --fail-under 100 -- \
            python -m pytest -q -x -p no:cacheprovider tests/test_daylight_heartbeat.py | tee mutation-fixture.txt
          status=${PIPESTATUS[0]}
          { echo "### Mutation run: daylight_heartbeat.yaml"; echo; echo '```'; tail -n 30 mutation-fixture.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Mutation runs on the reference automations
        if: always()
        run: |
          set +e
          failed=0
          for name in humidity_warning range_charging outage_lock sun_shutter arrival_reminder button_scenes; do
            python -m ha_blueprint_test_harness.mutate "tests/automations/$name.yaml" --fail-under 90 -- \
              python -m pytest -q -x -p no:cacheprovider "tests/test_$name.py" | tee "mutation-$name.txt"
            [ "${PIPESTATUS[0]}" -eq 0 ] || failed=1
            { echo "### Mutation run: $name.yaml"; echo; echo '```'; tail -n 30 "mutation-$name.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
