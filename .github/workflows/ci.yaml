name: CI

# Job "tests" runs the project's own tests with `pytest-homeassistant` (maintained in Home Assistant core,
# requirements-dev.txt). Job "tests-custom-component" runs the same tests with the older package
# `pytest-homeassistant-custom-component` (requirements-dev-custom-component.txt). The jobs "mutation-run" break
# motion_light.yaml, the fixture blueprint and each reference automation in small ways (one run each, side by side)
# and fail if the tests stop noticing; the survivors, if any, are listed in the job summary. They use the package from
# core. The job "mutation" only collects their result under the name that the branch rules require.
#
# Everything that is installed or run comes from a fixed version: the actions are pinned to commit ids (the comment
# names the version; Dependabot proposes updates), and the packages come from the .lock files with hashes
# (`pip install --require-hashes`). To change a version, edit the .txt file, regenerate the lock (the command is in its
# first lines) and commit both. No checkout keeps the token (persist-credentials: false): test code of a pull request
# must not be able to read it.
#
# The jobs run side by side (the slow mutation job does not wait for the tests). Nothing is skipped: both always
# run, so a green check always means that the work was done. If the tests fail on the unchanged blueprint, the
# mutation tool stops by itself and says so (see docs/mutation-testing.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip list | grep -E "^(homeassistant|pytest-homeassistant[a-z-]*) "

      - name: Tests
        run: python -m pytest -p no:cacheprovider -q

  tests-custom-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev-custom-component.lock

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev-custom-component.txt
          python -m pip list | grep -E "^(homeassistant|pytest-homeassistant[a-z-]*) "

      - name: Tests
        run: python -m pytest -p no:cacheprovider -q

  # One run per blueprint or automation, side by side on separate runners: the wait is that of the slowest one. Each has its
  # own floor, the score measured when it was written, rounded DOWN (44 of 45 is 97.8 %, so the floor is 97). Equivalent
  # mutants count as survivors (memory/equivalent-mutants.md), so a floor below 100 is not a gap by itself. A lower score
  # means a test got weaker. "target" is the file to break; "ha:motion_light" is the blueprint shipped with Home Assistant.
  mutation-run:
    name: mutation-run (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: motion_light, target: "ha:motion_light", test: tests/test_motion_light.py, floor: 100}
          - {name: daylight_heartbeat, target: tests/blueprints/daylight_heartbeat.yaml, test: tests/test_daylight_heartbeat.py, floor: 100}
          - {name: humidity_warning, target: tests/automations/humidity_warning.yaml, test: tests/test_humidity_warning.py, floor: 93}
          - {name: range_charging, target: tests/automations/range_charging.yaml, test: tests/test_range_charging.py, floor: 92}
          - {name: outage_lock, target: tests/automations/outage_lock.yaml, test: tests/test_outage_lock.py, floor: 100}
          - {name: sun_shutter, target: tests/automations/sun_shutter.yaml, test: tests/test_sun_shutter.py, floor: 88}
          - {name: arrival_reminder, target: tests/automations/arrival_reminder.yaml, test: tests/test_arrival_reminder.py, floor: 97}
          - {name: button_scenes, target: tests/automations/button_scenes.yaml, test: tests/test_button_scenes.py, floor: 93}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Mutation run
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          TEST: ${{ matrix.test }}
          FLOOR: ${{ matrix.floor }}
        run: |
          if [ "$TARGET" = "ha:motion_light" ]; then
            TARGET="$(python -c "import pathlib, homeassistant.components.automation as a; print(pathlib.Path(a.__file__).parent / 'blueprints' / 'motion_light.yaml')")"
          fi
          set +e
          python -m ha_blueprint_test_harness.mutate "$TARGET" --jobs 4 --fail-under "$FLOOR" -- \
            python -m pytest -q -x -p no:cacheprovider "$TEST" | tee mutation.txt
          status=${PIPESTATUS[0]}
          { echo "### Mutation run: $NAME (floor $FLOOR %)"; echo; echo '```'; tail -n 30 mutation.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The check that the branch rules require. It is green only when every run above is green; a skipped or cancelled run
  # is not green either.
  mutation:
    needs: mutation-run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All mutation runs passed
        env:
          RESULT: ${{ needs.mutation-run.result }}
        run: |
          echo "mutation runs: $RESULT"
          [ "$RESULT" = "success" ]
