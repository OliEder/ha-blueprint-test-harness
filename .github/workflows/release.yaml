name: Release

# Runs when a version tag such as v0.1.0 is pushed. It checks the tag against the package version and the
# changelog, runs the tests, builds the package, and creates a DRAFT GitHub release with the built files and
# the changelog section as notes. A person reviews the draft and publishes it. See RELEASING.md.
#
# It can also be started by hand (Actions, Release, Run workflow) as a DRY RUN: the same checks, tests, build and
# upload and download of the files, but no tag is needed and no release is created. Release tags cannot be moved or
# deleted, so run the dry run on the commit that is going to be tagged, before the tag is pushed. Only the job that
# creates the release has write permission, and it runs only for a tag. The files come with a SHA256SUMS file.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: The tag matches the version and the changelog
        if: github.ref_type == 'tag'
        run: python tools/release_info.py check-tag "$GITHUB_REF_NAME"

      - name: Dry run, the version can be released and the changelog has its section
        if: github.ref_type != 'tag'
        run: python tools/release_info.py check-tag "v$(python tools/release_info.py version)"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Tests
        run: python -m pytest -p no:cacheprovider -q

  build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # The build tools come from a lock file with hashes and the build runs without isolation, so that the build
      # does not fetch a newer setuptools on the day (pip install build / python -m build would).
      - name: Build the source archive and the wheel
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          python -m build --no-isolation

      - name: Checksums of the files
        working-directory: dist
        run: |
          # Into a temporary file first: with `| tee SHA256SUMS` the new file could be listed in its own checksums.
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # The dry run only reads: it has no write permission, so a hand-started run on any ref cannot create a release.
  dry-run:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Dry run, what would be released
        run: |
          version="$(python tools/release_info.py version)"
          ls -l dist/
          (cd dist && sha256sum --check SHA256SUMS)
          python tools/release_info.py notes "$version"
          echo "Dry run: no release was created."

  # Only a pushed version tag gets the write permission.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          version="$(python tools/release_info.py version)"
          python tools/release_info.py notes "$version" > release-notes.md
          flags=""
          if [ "$(python tools/release_info.py is-prerelease "$version")" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft $flags --title "$GITHUB_REF_NAME" --notes-file release-notes.md
